name: Release
on:
  push:
    tags: ['murmuration--v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the skill (for claude.ai uploads)
        run: cd skills && zip -r ../murmuration-skill.zip murmuration
      - run: gh release create "$GITHUB_REF_NAME" murmuration-skill.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
