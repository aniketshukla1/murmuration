name: Release
on:
  push:
    tags: ['murmuration--v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the skill (for chat apps that take skill uploads)
        run: cd skills && zip -r ../murmuration-skill.zip murmuration
      # Attach the zip to the release the maintainer created for this tag (so it stays in their
      # name); only when there is none yet does the workflow create one itself.
      - run: gh release upload "$GITHUB_REF_NAME" murmuration-skill.zip --clobber || gh release create "$GITHUB_REF_NAME" murmuration-skill.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
